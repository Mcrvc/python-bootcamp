name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  bootcamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest ruff
      - name: Lint
        run: ruff check . --select E4,E7,E9,F
      - name: Test each member's week-1 homework
        run: |
          variant() {
            case "$1" in
              Mcrvc|mcrvc) echo 1 ;;
              akagikay) echo 2 ;;
              truonghuy0411) echo 3 ;;
              tba0407) echo 4 ;;
              *) echo 0 ;;   # members 5-7: own W1-4, no instructor test
            esac
          }
          for dir in members/*/w1; do
            [ -d "$dir" ] || continue
            m=$(basename "$(dirname "$dir")")
            v=$(variant "$m")
            echo "== $m (variant $v)"
            if [ "$v" = 0 ]; then
              pytest -q tests/test_w1.py --member "$m" -k "not translate"
            else
              pytest -q tests/test_w1.py --member "$m" --variant "$v"
            fi
          done
      - name: No conflict markers
        run: "! git grep -n -E '^(<<<<<<<|>>>>>>>)'"
