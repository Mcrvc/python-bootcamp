name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  bootcamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest ruff
      - name: Run Ruff Linter
        run: ruff check . --extend-exclude tests/
      - name: Test every member explicitly
        run: |
          for member_dir in members/*/; do
            # If the directory is completely empty, skip to the next member
            if [ -z "$(ls -A "$member_dir")" ]; then
              continue
            fi
            
            username=$(basename "$member_dir")
            echo "========================================"
            echo "Running tests for: $username"
            echo "========================================"
            
            pytest -q tests/ --member "$username"
          done